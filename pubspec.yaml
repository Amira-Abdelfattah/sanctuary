name: sanctuary_app
description: "Sanctuary - Smart Home Safety Monitoring App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.1.4

  # State management
  provider: ^6.1.2

  # UI / Fonts / Icons
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # Utilities
  equatable: ^2.0.5
  intl: ^0.19.0
  fl_chart: ^0.69.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
